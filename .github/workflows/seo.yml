name: FirstRead AI SEO Monitoring
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: audit
        options: [audit, recommend]
        description: Scheduled read-only audit or AI recommendations
  schedule:
    - cron: '17 6 * * *' # Daily at 06:17 UTC
    - cron: '27 7 * * 1' # Weekly on Monday at 07:27 UTC
permissions:
  contents: read
concurrency:
  group: firstread-seo-monitoring
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Choose mode
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          mode="${INPUT_MODE:-audit}"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Run FirstRead Read-Only SEO Monitoring
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: npm run automation -- "$MODE"
      - name: Validate Tests & Types
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Save Audit Snapshot to History Branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add content/reports
          if git diff --cached --quiet; then exit 0; fi
          branch="monitoring/firstread-audit-${{ github.run_id }}"
          git switch -c "$branch"
          git config user.name "firstread-seo-automation"
          git config user.email "automation@users.noreply.github.com"
          git add content/reports
          git commit -m "chore: save FirstRead read-only SEO audit snapshot [skip ci]"
          git push origin "$branch"
